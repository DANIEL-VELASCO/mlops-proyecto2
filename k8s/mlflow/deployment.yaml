apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-deployment
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.11.3
          command:
            - /bin/bash
            - -c
            - |
              pip install psycopg2-binary boto3 && \
              mlflow server \
                --host 0.0.0.0 \
                --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB} \
                --default-artifact-root s3://${MINIO_BUCKET}/ \
                --serve-artifacts
          ports:
            - containerPort: 5000
          env:
            # Variables de PostgreSQL (Contrato)
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "mlops_user"
            - name: POSTGRES_PASSWORD
              value: "mlops_pass"
            - name: POSTGRES_DB
              value: "mlops_db"
            # Variables de MinIO para simular S3 (Contrato)
            - name: MINIO_BUCKET
              value: "mlflow-artifacts"
            - name: AWS_ACCESS_KEY_ID
              value: "minio_admin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minio_secret123"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio-service:9000"